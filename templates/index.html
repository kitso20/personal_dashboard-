<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Dashboard</h1>
        </header>
        
        <main>
            {% if logged_in %}
                <div class="welcome-section">
                    <p>Welcome back, {{ user.name }}!</p>
                    <div class="actions">
                        <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
                        <a href="/logout" class="btn btn-secondary">Logout</a>
                    </div>
                </div>
            {% else %}
                <div class="login-section">
                    <p>A custom Personal Dashboard application with Google OAuth authentication.</p>
                    <div class="actions">
                        <a href="/login" class="btn btn-google">
                            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" width="18" height="18">
                            Sign in with Google
                        </a>
                    </div>
                </div>
            {% endif %}
        </main>
    </div>
</body>
</html>
